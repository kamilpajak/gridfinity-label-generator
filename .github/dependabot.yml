version: 2
updates:
  # JavaScript/TypeScript dependencies (npm ecosystem also handles pnpm lockfiles)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Europe/Warsaw'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    # Only propose versions old enough to clear the pnpm minimumReleaseAge
    # supply-chain gate, with longer waits for riskier bumps so the ecosystem
    # can surface breakage and peer deps can catch up. Security updates bypass
    # cooldown automatically.
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    ignore:
      # TypeScript 7 changed the shape of the module export, which breaks
      # svelte-check (it reads `typescript.default.sys`) and is outside the
      # range typescript-eslint accepts. Latest versions of both, as of
      # 2026-07-29, still declare narrower peer ranges:
      #   svelte-check@4.7.4   -> typescript ^5.0.0 || ^6.0.0
      #   typescript-eslint    -> typescript >=4.8.4 <6.1.0
      # Stay on the 6.x line until both support 7.x, then drop this entry.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'

  # GitHub Actions used in workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Europe/Warsaw'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'ci'
      include: 'scope'
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
    ignore:
      # Only even-numbered Node releases become LTS. Odd ones are supported for
      # about eight months, so the base image must skip them: Node 25 reached
      # end of life on 2026-06-01, before Dependabot's proposal was even old
      # enough to merge. Add the next odd major here when it appears.
      - dependency-name: 'node'
        versions:
          - '25.x'
    cooldown:
      default-days: 7
      semver-major-days: 14
